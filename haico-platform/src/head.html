/* TOKENS:END */
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:14.5px/1.5 var(--font);-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--primary)}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
.mono,.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted-fg)}
.weave{height:5px;width:120px;border-radius:99px;background:repeating-linear-gradient(90deg,var(--cedar) 0 14px,var(--ochre) 14px 22px,var(--ocean) 22px 36px)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- app shell ---------- */
#app{height:100%;display:flex;flex-direction:column}
.banner{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:32px;padding:4px 16px;background:var(--banner-bg);color:var(--banner-fg);border-bottom:1px solid var(--banner-border);font-size:12px}
.banner .tag{background:var(--banner-fg);color:var(--banner-bg);border-radius:4px;padding:1px 7px;font-size:10px;font-weight:700;letter-spacing:.12em}
.banner .note{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.banner button{background:none;border:0;padding:0;font-weight:600;text-decoration:underline;cursor:pointer;color:inherit}
.shell{flex:1;min-height:0;display:flex}
.side{width:248px;flex:none;background:var(--side);color:var(--side-fg);display:flex;flex-direction:column;border-right:1px solid var(--side-border)}
.side .brand{padding:16px 18px 14px;border-bottom:1px solid var(--side-border)}
.side .brand b{display:block;color:var(--side-hi);font-size:15px;letter-spacing:.12em}
.side .brand small{display:block;color:var(--side-dim);font-size:10px;letter-spacing:.08em;margin:2px 0 10px}
.side .brand .weave{width:80px;height:4px}
.side nav{flex:1;overflow-y:auto;padding:6px 8px 12px}
.side .grp{margin-top:10px}
.side .grp-l{color:var(--side-dim);font-size:11px;font-weight:600;padding:6px 10px 4px}
.side .item{display:flex;align-items:center;gap:9px;width:100%;border:0;background:none;color:var(--side-fg);text-align:left;padding:6px 10px;border-radius:7px;font-size:13px;cursor:pointer}
.side .item:hover{background:var(--side-acc);color:var(--side-hi)}
.side .item.on{background:var(--side-acc);color:var(--side-hi);font-weight:600;box-shadow:inset 3px 0 0 var(--cedar)}
.side .item svg{width:16px;height:16px;flex:none;opacity:.85}
.side .grp-btn{justify-content:flex-start}
.side .chev{margin-left:auto;font-size:18px;line-height:1;transition:transform .15s;color:var(--side-dim)}
.side .chev.open{transform:rotate(90deg)}
.side .sub{margin:2px 0 4px 14px;padding-left:10px;border-left:1px solid var(--side-border)}
.side .sub .item{padding:5px 8px;font-size:12.5px}
/* Feedback (cedar red) and Email (ocean blue): solid, quiet, from the HaiCo palette */
.fbb{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 13px;border-radius:99px;border:1px solid transparent;font:inherit;font-size:12.5px;font-weight:600;letter-spacing:.01em;color:#fff;cursor:pointer;transition:background-color .15s,box-shadow .15s}
.fbb svg{width:14px;height:14px;opacity:.9}
.fbb-fb{background:#9b3b29;border-color:#8a3323}.fbb-fb:hover{background:#86321f}
.fbb-mail{background:#1b5c72;border-color:#164e61}.fbb-mail:hover{background:#154b5d}
.fbb:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
.fbb[aria-expanded="true"]{box-shadow:0 0 0 3px color-mix(in srgb,#9b3b29 22%,transparent)}
.fbb-n{background:rgba(255,255,255,.92);color:#1b5c72;border-radius:99px;padding:0 6px;font-size:10px;font-weight:700;line-height:16px}
.foot-sep{width:1px;height:20px;background:var(--border);margin:0 4px}
@media (max-width:640px){.foot-sep{display:none}.foot{text-align:center}}
.side .item .bdg{margin-left:auto;background:var(--side-pri);color:var(--side-pri-fg);border-radius:99px;font-size:10.5px;font-weight:700;padding:0 7px;min-width:20px;text-align:center}
.side .me{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--side-border)}
.side .me .av{width:32px;height:32px;border-radius:50%;background:var(--side-pri);color:var(--side-pri-fg);display:grid;place-items:center;font-size:12px;font-weight:600;flex:none}
.side .me b{display:block;font-weight:500;font-size:12.5px;color:var(--side-hi);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side .me small{display:block;font-size:11px;color:var(--side-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:10px;height:54px;flex:none;padding:0 16px;background:var(--card);border-bottom:1px solid var(--border)}
.top .co{font-weight:600;display:flex;align-items:center;gap:8px;min-width:0}
.top .co .sq{width:10px;height:10px;border-radius:3px;flex:none}
.top .co span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sp{flex:1}
.menu-btn{display:none}
.iconbtn{position:relative;display:inline-grid;place-items:center;width:36px;height:36px;border-radius:8px;border:1px solid var(--border);background:var(--card);cursor:pointer}
.iconbtn:hover{border-color:var(--primary)}
.iconbtn svg{width:17px;height:17px}
.iconbtn .dot{position:absolute;top:-4px;right:-4px;background:var(--side-pri);color:var(--side-pri-fg);border-radius:99px;font-size:10px;font-weight:700;min-width:18px;height:18px;display:grid;place-items:center;padding:0 5px}
.live{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;border-radius:99px;padding:3px 10px;border:1px solid var(--border);white-space:nowrap}
.live i{width:7px;height:7px;border-radius:50%;background:var(--muted-fg)}
.live.on{color:var(--t-green);background:var(--t-green-bg);border-color:transparent}
.live.on i{background:var(--t-green);animation:pulse 2s infinite}
.live.local{color:var(--t-amber);background:var(--t-amber-bg);border-color:transparent}
.live.local i{background:var(--t-amber)}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--t-green) 60%,transparent)}70%{box-shadow:0 0 0 6px transparent}100%{box-shadow:0 0 0 0 transparent}}
.co-select{height:34px;border-radius:8px;border:1px solid var(--input);background:var(--card);padding:0 8px;max-width:210px}
.content{flex:1;overflow-y:auto;padding-block:22px 80px;padding-inline:24px}
.foot{flex:none;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px 12px;padding:8px 16px;border-top:3px solid var(--cedar);background:var(--card);font-size:13px;color:var(--muted-fg)}
.foot img{height:30px;width:auto;flex:none}
.foot strong{color:var(--fg)}
@media (max-width:860px){.foot{padding-left:16px;padding-right:16px;font-size:12px}}
.wrap{max-width:1240px;margin:0 auto}
.stale{display:inline-flex;align-items:center;gap:8px;font-size:12px;background:var(--t-teal-bg);color:var(--t-teal);border:0;border-radius:99px;padding:5px 12px;font-weight:600;cursor:pointer}

/* dropdown panel */
.pop{position:absolute;right:16px;top:58px;width:min(380px,calc(100vw - 32px));background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);z-index:40;overflow:hidden}
.pop h4{margin:0;padding:12px 14px;font-size:13px;display:flex;justify-content:space-between;border-bottom:1px solid var(--border)}
.pop .list{max-height:60vh;overflow-y:auto}
.pop .n{display:block;width:100%;text-align:left;border:0;background:none;padding:10px 14px;border-bottom:1px solid var(--border);cursor:pointer}
.pop .n:hover{background:var(--muted)}
.pop .n b{display:block;font-size:12.5px;font-weight:600}
.pop .n span{display:block;font-size:11.5px;color:var(--muted-fg)}
.pop .n.unread b::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--cedar);margin-right:6px;vertical-align:1px}

/* ---------- page parts ---------- */
.ph{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px;margin-bottom:18px}
.ph h1{margin:0;font-size:22px;font-weight:600;letter-spacing:-.01em;text-wrap:balance}
.ph p{margin:4px 0 0;color:var(--muted-fg);font-size:13px;max-width:70ch}
.ph .acts{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.crumb{font-size:12px;margin-bottom:6px}
.crumb button{border:0;background:none;padding:0;color:var(--primary);font-weight:600;cursor:pointer}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;min-width:0}
.card-h{padding:14px 16px 6px;font-size:14.5px;font-weight:600;display:flex;align-items:center;justify-content:space-between;gap:10px}
.card-b{padding:8px 16px 16px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-main{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.stats{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:13px 16px}
.stat.primary{background:var(--t-teal-bg);border-color:transparent}
.stat.good{background:var(--t-green-bg);border-color:transparent}
.stat.warn{background:var(--t-amber-bg);border-color:transparent}
.stat .l{font-size:10.5px;font-weight:700;letter-spacing:.07em;color:var(--muted-fg);text-transform:uppercase}
.stat .v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:21px;font-weight:600;margin-top:6px;letter-spacing:-.01em}
.stat .h{font-size:11.5px;color:var(--muted-fg);margin-top:5px}
.sect-l{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--muted-fg);margin:22px 0 10px;text-transform:uppercase}
.badge{display:inline-flex;align-items:center;white-space:nowrap;border-radius:99px;padding:2px 9px;font-size:11px;font-weight:600}
.tone-green{background:var(--t-green-bg);color:var(--t-green)}.tone-amber{background:var(--t-amber-bg);color:var(--t-amber)}
.tone-red{background:var(--t-red-bg);color:var(--t-red)}.tone-blue{background:var(--t-blue-bg);color:var(--t-blue)}
.tone-teal{background:var(--t-teal-bg);color:var(--t-teal)}.tone-grey{background:var(--t-grey-bg);color:var(--t-grey)}
.tone-ink{background:var(--t-ink-bg);color:var(--t-ink)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted-fg)}
.sq{display:inline-block;width:9px;height:9px;border-radius:2px;flex:none}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:600;flex:none}
.msg{border-radius:10px;padding:11px 14px;font-size:13px;margin-bottom:14px}
.msg.ok{background:var(--t-green-bg);color:var(--t-green)}.msg.err{background:var(--t-red-bg);color:var(--t-red)}
.msg.info{background:var(--t-teal-bg);color:var(--t-teal)}.msg.warn{background:var(--t-amber-bg);color:var(--t-amber)}
.empty{padding:34px 16px;text-align:center;color:var(--muted-fg)}
.empty b{display:block;color:var(--fg);font-weight:600;margin-bottom:4px}
.tabs{display:flex;flex-wrap:wrap;gap:4px;border-bottom:1px solid var(--border);margin-bottom:14px}
.tabs button{border:0;background:none;padding:8px 12px;font-size:13px;font-weight:500;color:var(--muted-fg);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--fg);border-bottom-color:var(--cedar);font-weight:600}
.tabs button .c{font-family:var(--mono);font-size:11px;margin-left:4px}

/* buttons & forms */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 14px;border-radius:8px;border:1px solid var(--input);background:var(--card);font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;text-decoration:none;color:var(--fg)}
.btn:hover{border-color:var(--primary)}
.btn.pri{background:var(--primary);border-color:var(--primary);color:var(--primary-fg)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.dng{color:var(--danger)}
.btn.sm{height:30px;padding:0 10px;font-size:12px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.lnk{border:0;background:none;padding:0;color:var(--primary);font-weight:600;cursor:pointer;font-size:inherit;text-align:left}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld label{font-size:12px;font-weight:600;color:var(--muted-fg)}
.in{height:38px;width:100%;border-radius:8px;border:1px solid var(--input);background:var(--card);padding:0 10px;font-size:13.5px}
textarea.in{height:auto;min-height:70px;padding:8px 10px;resize:vertical}
.in:focus{outline:2px solid color-mix(in srgb,var(--ring) 45%,transparent);outline-offset:0}
.form-grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.form-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.hint{font-size:11.5px;color:var(--muted-fg)}

/* tables */
.tw{overflow-x:auto;min-width:0}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:left;font-size:10.5px;font-weight:700;letter-spacing:.06em;color:var(--muted-fg);text-transform:uppercase;padding:9px 12px;background:var(--row-head);border-bottom:1px solid var(--border);white-space:nowrap}
table.t td{padding:9px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
table.t tr:last-child td{border-bottom:0}
table.t tr.click{cursor:pointer}
table.t tr.click:hover td{background:var(--muted)}
table.t .r{text-align:right}
table.t tr.tot td{font-weight:700;background:var(--row-total)}
table.t tr.sub td{font-weight:600;background:var(--row-sect);font-size:12px}
.card > .tw > table.t tr:first-child th:first-child{border-top-left-radius:12px}
.card > .tw > table.t tr:first-child th:last-child{border-top-right-radius:12px}

/* approval cards / rows */
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;border-top:1px solid var(--border)}
.row:first-child{border-top:0}
.row .grow{flex:1;min-width:200px}
.row .t1{font-weight:600;font-size:13.5px}
.row .t2{font-size:12px;color:var(--muted-fg);margin-top:2px}
.kind{font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--muted-fg);margin-right:6px}

/* timesheet grid */
table.tsg{width:100%;min-width:900px;border-collapse:collapse;font-size:12.5px}
table.tsg th{font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--muted-fg);padding:8px 6px;background:var(--row-head);text-align:center}
table.tsg th:first-child,table.tsg td:first-child{padding-left:12px;text-align:left}
table.tsg td{padding:4px 6px;border-top:1px solid var(--border);text-align:center}
table.tsg tr.we td{color:var(--muted-fg)}
table.tsg tr.sect td{background:var(--row-sect);font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--muted-fg);text-align:left;padding:4px 12px}
table.tsg tr.wt td{background:var(--row-total);font-weight:700;font-family:var(--mono)}
table.tsg tr.stat td{background:var(--stat-bg)}
.cell{height:28px;width:58px;border-radius:6px;border:1px solid var(--input);background:var(--card);text-align:center;font-family:var(--mono);font-size:11.5px}
.cell[disabled]{opacity:.45}
.lv{display:inline-flex;align-items:center;justify-content:center;height:28px;width:58px;border-radius:6px;background:var(--leave);color:var(--leave-fg);font-family:var(--mono);font-size:11.5px;font-weight:600}
.lv.e{opacity:.55;color:transparent}
.sh{display:inline-flex;align-items:center;justify-content:center;height:28px;width:58px;border-radius:6px;border:1.5px dashed var(--stat-border);background:var(--stat-bg);color:var(--leave-fg);font-family:var(--mono);font-size:11.5px;font-weight:600}
.tsg select{height:28px;max-width:150px;border-radius:6px;border:1px solid var(--input);background:var(--card);font-size:11.5px;padding:0 4px}
.legend{display:flex;flex-wrap:wrap;gap:14px;align-items:center;padding:10px 14px;font-size:11.5px;color:var(--muted-fg);border-top:1px solid var(--border)}
.legend .sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:5px}

/* statement */
.stmt{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:24px;max-width:860px}
.stmt .hd{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;border-bottom:2px solid var(--fg);padding-bottom:14px}
.stmt .meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;padding:14px 0;border-bottom:1px solid var(--border)}
.stmt .meta div{font-size:13px}
.stmt .k{font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--muted-fg);text-transform:uppercase;display:block;margin-bottom:2px}
.stmt .net{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-top:16px}
.stmt .net div{border-radius:10px;padding:12px 14px;background:var(--muted)}
.stmt .net .take{background:var(--primary);color:var(--primary-fg)}
.stmt .net .take .k{color:inherit;opacity:.8}
.stmt .net b{font-family:var(--mono);font-size:19px}

/* charts */
.chart svg{display:block;width:100%;height:auto}
.chart .gl{stroke:var(--grid);stroke-width:1}
.chart .ax{fill:var(--muted-fg);font-size:11px;font-family:var(--mono)}
.chart .lab{fill:var(--muted-fg);font-size:11px}
.bar-in{fill:var(--chart-in)}.bar-out{fill:var(--chart-out)}
.tip{position:fixed;pointer-events:none;z-index:60;background:var(--card);border:1px solid var(--border);box-shadow:var(--shadow);border-radius:8px;padding:8px 10px;font-size:12px;min-width:150px}
.tip b{display:block;margin-bottom:4px}
.tip .ln{display:flex;justify-content:space-between;gap:14px}
.hbar{display:flex;align-items:center;gap:10px;font-size:12.5px;margin:9px 0}
.hbar .nm{width:140px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted-fg)}
.hbar .tr{flex:1;height:8px;border-radius:99px;background:var(--muted);overflow:hidden}
.hbar .tr i{display:block;height:100%;border-radius:99px}

/* login */
.login{display:flex;min-height:100%}
.login .brandp{width:520px;flex:none;background:var(--side);color:var(--side-fg);padding:48px;display:flex;flex-direction:column}
/* light sign-in: white panel, red wave, the HaiCo logo, no writing */
.login .brandp.light{background:var(--card);color:var(--fg);padding:0;position:relative;--wave-fill:var(--bg);border-right:1px solid var(--border)}
.login .brandp.light .wave{display:block;width:100%;height:150px}
@media (max-width:1000px){#toGrid{grid-template-columns:1fr!important}}
.lv-box{border:1px solid var(--ok-line);background:var(--ok-bg);color:var(--ok);border-radius:10px;padding:12px 16px;font-size:13.5px;line-height:1.55}
.lv-box.bad{border-color:var(--bad-line);background:var(--bad-bg);color:var(--bad)}
.btn.pri:disabled{opacity:.5;cursor:not-allowed}
.login .brandp.light .brand-inner{padding:48px 48px 0;display:flex;flex-direction:column;align-items:center;gap:26px}
.login .brandp.light .logo{width:170px;height:auto}
.login .brandp.light .cos{width:100%}
.login .brandp.light .coi{background:var(--bg);border-color:var(--border)}
.login .brandp.light .coi b{color:var(--fg)}.login .brandp.light .coi small{color:var(--muted-fg)}
.login .brandp.light .foot{border-top:0;background:none;font-size:12px;margin-top:auto;padding:26px 48px 14px;color:var(--muted-fg)}
.login.light .formp{background:var(--bg)}
.login .brandp h1{margin:0;color:var(--fg);font-size:28px;letter-spacing:.12em;font-weight:700}
.login .brandp .sub{font-size:12px;letter-spacing:.16em;color:var(--muted-fg);margin:4px 0 18px}
.login .brandp p{max-width:36ch;font-size:15px;line-height:1.6;color:var(--muted-fg);margin:34px 0 26px}
.login .coi{display:flex;gap:12px;align-items:center;border:1px solid var(--side-border);background:var(--muted);border-radius:12px;padding:11px 15px;margin-bottom:10px}
.login .coi b{display:block;color:var(--fg);font-size:13.5px}
.login .coi small{color:var(--muted-fg);font-size:11.5px}
.login .foot{margin-top:auto;padding-top:26px;font-size:12px;color:var(--muted-fg);display:flex;gap:10px;align-items:center}
.login .foot .tag{background:var(--warn-bg);color:var(--warn);border-radius:4px;padding:1px 7px;font-size:10px;font-weight:700;letter-spacing:.14em}
.login .formp{flex:1;display:flex;align-items:center;justify-content:center;padding-block:32px;padding-inline:20px}
.login .box{width:100%;max-width:440px}
.login h2{margin:0;font-size:24px;font-weight:600}
.or{display:flex;align-items:center;gap:12px;margin:26px 0 14px;font-size:11px;font-weight:600;letter-spacing:.1em;color:var(--muted-fg)}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--border)}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.roles .btn{justify-content:flex-start;height:44px}
.pw{font-family:var(--mono);font-weight:600;background:var(--muted);border-radius:4px;padding:1px 6px;color:var(--fg)}
.choose{max-width:760px;margin:0 auto;padding-block:40px;padding-inline:20px}
.cogrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));margin-top:18px}
.cocard{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;cursor:pointer}
.cocard:hover{border-color:var(--primary)}
.cocard b{font-size:15px}
.cocard small{color:var(--muted-fg)}

/* toasts, feedback, drawer */
.toasts{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:80;max-width:min(380px,calc(100vw - 32px))}
.toast{background:var(--card);border:1px solid var(--border);border-left:4px solid var(--primary);border-radius:10px;box-shadow:var(--shadow);padding:10px 14px;font-size:13px;animation:tin .25s ease-out}
.toast.ok{border-left-color:var(--moss)}.toast.err{border-left-color:var(--danger)}.toast.live{border-left-color:var(--ochre)}
.toast small{display:block;color:var(--muted-fg);font-size:11px;margin-bottom:2px;font-weight:600;letter-spacing:.04em}
@keyframes tin{from{transform:translateY(8px);opacity:.4}to{transform:none;opacity:1}}
.fb-btn{display:flex;gap:8px}
.fb-panel{position:fixed;left:calc(50% + 124px);transform:translateX(-50%);bottom:calc(64px + env(safe-area-inset-bottom,0px));width:min(340px,calc(100vw - 32px));z-index:45;background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);padding:14px}
.scrim{position:fixed;inset:0;background:rgba(10,10,12,.45);z-index:50}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(520px,calc(100vw - 32px));max-height:calc(100vh - 48px);overflow-y:auto;background:var(--card);border-radius:14px;box-shadow:var(--shadow);z-index:55;padding:20px}
.modal h3{margin:0 0 4px;font-size:17px}
.drop{border:1.5px dashed var(--input);border-radius:10px;padding:16px;text-align:center;color:var(--muted-fg);font-size:12.5px;background:var(--bg)}
.drop.over{border-color:var(--primary);background:var(--t-teal-bg);color:var(--t-teal)}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:6px 16px;font-size:13px}
.kv dt{color:var(--muted-fg)}
.kv dd{margin:0}
.bigsum{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:baseline;border-radius:12px;background:var(--primary);color:var(--primary-fg);padding:16px 18px;margin-top:14px}
.bigsum b{font-family:var(--mono);font-size:22px}
.steps{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.steps span{font-size:11px;border-radius:99px;padding:2px 8px;background:var(--muted);color:var(--muted-fg)}
.steps span.done{background:var(--t-green-bg);color:var(--t-green)}
.steps span.cur{background:var(--t-amber-bg);color:var(--t-amber);font-weight:600}

@media (max-width:1100px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g-main{grid-template-columns:minmax(0,1fr)}}
@media (max-width:860px){
  .side{position:fixed;left:0;top:0;bottom:0;z-index:70;transform:translateX(-102%);transition:transform .2s;padding-top:env(safe-area-inset-top,0px)}
  .side.open{transform:none;box-shadow:var(--shadow)}
  .menu-btn{display:inline-grid}
  .fb-panel{left:50%}
  .login .brandp{display:none}
  .g2,.g3{grid-template-columns:minmax(0,1fr)}
  .content{padding-inline:16px}
  .top{padding:0 12px;gap:8px}
  .co-select{max-width:130px}
  .banner .note{display:none}
}
@media (max-width:520px){.top .co{display:none}.live .lt{display:none}.roles{grid-template-columns:1fr}}

/* ---- v8: pills, attachments, people, profile ---- */
.pillnav{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:0 0 14px;padding:0 0 10px;border-bottom:1px solid var(--border)}
.pillnav .pl{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--muted-fg);margin-right:4px}
.pill{border:1px solid var(--border);background:var(--card);color:var(--muted-fg);border-radius:999px;padding:4px 12px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.pill:hover{border-color:var(--primary);color:var(--fg)}.pill.on{background:var(--action);border-color:var(--action);color:var(--action-fg)}
.big-h{font-family:var(--font-head);font-size:21px;line-height:1.25;font-weight:600;letter-spacing:-.01em;margin:0;color:var(--fg)}
.ph h1.big-h{font-size:21px}.big-p{font-size:13px;color:var(--muted-fg);margin:2px 0 14px;max-width:90ch;line-height:1.45}
.fdrop{display:flex;flex-direction:column;align-items:center;gap:3px;border:1.5px dashed var(--input);background:var(--bg);border-radius:12px;padding:16px;text-align:center;cursor:pointer;color:var(--muted-fg);font-size:12.5px}
.fdrop b{color:var(--fg);font-weight:600}.fdrop.over{border-color:var(--primary);background:var(--info-bg);color:var(--info)}
.fchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.fchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--card);border-radius:999px;padding:2px 10px;font:inherit;font-size:11.5px;font-weight:500;max-width:260px}
.fchip small{color:var(--muted-fg)}.fchip.link{color:var(--info);cursor:pointer}.fchip.link:hover{border-color:var(--info)}
.btn.danger{border-color:var(--bad-line);background:var(--bad-bg);color:var(--bad)}
.seg{display:inline-flex;gap:4px;border:1px solid var(--border);background:var(--card);border-radius:999px;padding:4px}
.seg button{border:0;background:none;font:inherit;font-size:12.5px;font-weight:600;color:var(--muted-fg);padding:6px 14px;border-radius:999px;cursor:pointer}.seg button.on{background:var(--action);color:var(--action-fg)}
.oboard{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-bottom:10px}
.ocol{border:1px solid var(--border);background:var(--card);border-radius:16px;padding:12px;min-height:120px;transition:background .15s,border-color .15s}
.ocol.over{border-color:var(--info);background:var(--info-bg);box-shadow:0 0 0 3px var(--info-line)}.ocol.blocked{border-color:var(--bad-line);background:var(--bad-bg)}
.och{border-bottom:1px solid var(--border);padding-bottom:8px;margin-bottom:8px}.och b{display:block;font-size:13.5px}.och small{font-size:11.5px;color:var(--muted-fg)}
.ocard{display:flex;align-items:center;gap:10px;border:1px solid var(--border);background:var(--bg);border-radius:12px;padding:7px 9px;margin-bottom:6px}
.ocard[draggable=true]{cursor:grab}.ocard.dragging{opacity:.4}.ocard b{display:block;font-size:13px;font-weight:500}.ocard small{display:block;font-size:11.5px;color:var(--muted-fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ocard .grip{color:var(--muted-fg);font-size:12px;letter-spacing:-2px}.oempty{border:1px dashed var(--border);border-radius:10px;padding:14px;text-align:center;font-size:12px;color:var(--muted-fg)}
.otree{list-style:none;margin:0;padding:0 0 0 22px;border-left:1px solid var(--border)}.otree.root{border:0;padding-left:0}.otree li{padding:5px 0}
.onode{display:inline-flex;align-items:center;gap:10px;border:1px solid var(--border);background:var(--card);border-radius:12px;padding:7px 12px}.onode b{display:block;font-size:13px}.onode small{font-size:11.5px;color:var(--muted-fg)}
.ptabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--border);margin-bottom:18px}
.ptabs button{border:0;background:none;font:inherit;font-size:14px;color:var(--muted-fg);padding:10px 16px;cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent}.ptabs button.on{color:var(--fg);border-color:var(--action);font-weight:600}
.pcard{border-radius:22px;padding:22px}.pcard h2{font-size:18px;font-weight:500;margin:0 0 12px}
.prow{display:grid;grid-template-columns:170px 1fr;gap:10px;padding:6px 0;font-size:14px}.prow>span:first-child{color:var(--muted-fg)}
.glance{border:1px solid var(--border);border-radius:16px;padding:14px 18px}.glance small{display:block;font-size:11.5px;font-weight:600;letter-spacing:.08em;color:var(--muted-fg)}.glance b{display:block;font-family:var(--mono);font-size:24px;color:var(--fg)}
.journey{list-style:none;margin:0;padding:0 0 0 22px;border-left:2px solid var(--border)}.journey li{position:relative;padding:0 0 16px}.journey li i{position:absolute;left:-30px;top:3px;width:14px;height:14px;border-radius:50%;border:2px solid var(--card)}
.journey small{display:block;font-size:12px;color:var(--muted-fg);font-weight:600}.journey b{display:block;font-weight:500;font-size:14px}
.dline{border:1px solid var(--border);border-radius:14px;padding:10px 14px;margin-top:8px}.bar{height:7px;border-radius:9px;background:var(--muted);overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--c1);border-radius:9px}
.obt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--border);border-radius:14px;padding:9px 12px;margin-top:8px}.obt>span{flex:none;width:20px;height:20px;border-radius:50%;border:2px solid var(--border);display:grid;place-items:center;font-size:11px}
.obt.done>span{background:var(--action);border-color:var(--action);color:var(--action-fg)}.obt.done b{text-decoration:line-through;color:var(--muted-fg)}.obt b{display:block;font-size:13.5px;font-weight:500}.obt small{font-size:12px;color:var(--muted-fg)}
.evc{display:flex;gap:14px;align-items:center;border:1px solid var(--border);background:var(--card);border-radius:14px;padding:10px 14px}.evd{width:46px;text-align:center;flex:none}.evd small{display:block;font-size:10.5px;font-weight:700;color:var(--muted-fg)}.evd b{font-family:var(--mono);font-size:22px}
@media (max-width:700px){.pillnav{margin:-16px -16px 16px;padding:10px 16px}.prow{grid-template-columns:120px 1fr}}

/* ---- v9: home, history, reports, how-to ---- */
.hero{margin-bottom:14px}
.qa{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:10px;margin-top:16px}
.qbtn{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;border:1px solid var(--border);background:var(--card);border-radius:16px;padding:12px 14px;font:inherit;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.04);transition:transform .12s,box-shadow .12s,border-color .12s}
.qbtn:hover{border-color:var(--primary)}.qbtn .qi{font-size:18px}.qbtn b{font-size:13px}.qbtn:hover b{color:var(--primary)}.qbtn small{font-size:11.5px;color:var(--muted-fg);line-height:1.35}
.h2{font-size:17px;font-weight:600;margin:0 0 8px}.h3{font-size:15px;font-weight:600;margin:0 0 8px;display:flex;justify-content:space-between;align-items:baseline}
.cnt{display:inline-block;background:var(--muted);color:var(--fg);font-family:var(--mono);font-variant-numeric:tabular-nums;border-radius:999px;font-size:12px;padding:1px 8px;margin-left:4px;vertical-align:2px}
.panel{border:1px solid var(--border);background:var(--card);border-radius:18px;padding:14px}
.panel-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;font-size:14.5px}
.wcard{border:1px solid var(--border);background:var(--bg);border-radius:14px;padding:10px 12px;margin-bottom:8px}.wk{font-size:10.5px;font-weight:700;letter-spacing:.06em;color:var(--t-amber)}
.wform{display:flex;gap:6px;margin-top:8px}.wform .in{flex:1;min-width:0;height:34px;border-radius:999px}.wform .btn{border-radius:999px}
.btn.ok{background:var(--action);border-color:var(--action);color:var(--action-fg)}.btn.ok:hover{background:var(--action-hover)}
.pillx{background:var(--muted);border-radius:999px;padding:1px 8px;font-size:11px}
.allclear{display:flex;gap:8px;align-items:center;border:0;background:none;color:var(--muted-fg);padding:14px 16px;font-size:13px}.allclear div{color:var(--ok);font-weight:700}
.evrow{display:flex;gap:12px;align-items:center;border:1px solid var(--border);background:var(--bg);border-radius:12px;padding:7px 10px;margin-bottom:6px}
.htl{list-style:none;margin:0 0 6px 10px;padding:0 0 0 18px;border-left:2px solid var(--border)}.htl li{position:relative;margin-bottom:8px}
.hdot{position:absolute;left:-31px;top:6px;width:24px;height:24px;border-radius:50%;background:var(--card);border:2px solid var(--bg);display:grid;place-items:center;font-size:11px;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.hbox{border:1px solid var(--border);background:var(--card);border-radius:12px;padding:8px 12px;font-size:13.5px;line-height:1.4}.hbox small{display:block;font-size:11.5px;color:var(--muted-fg);margin-top:2px}
